[project]
name = "ytt"
version = "0.1.0"
description = "Fetch a YouTube transcript as clean text, markdown or JSON"
requires-python = ">=3.12"
dependencies = [
    "youtube-transcript-api>=1.0",
    "yt-dlp>=2026.8.19",
]

[project.optional-dependencies]
dev = [
    "mypy>=2.4.0",
    "ruff>=0.17.1",
]

[tool.ruff]
line-length = 119
target-version = "py312"

[tool.mypy]
strict = false
ignore_missing_imports = true
python_version = "3.12"
